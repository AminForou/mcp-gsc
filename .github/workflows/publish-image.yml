# Publishes the remote-transport image on a v* tag.
#
# The deployment lives in a separate infrastructure repo, which pins a specific
# tag from here and never builds. That split is the point: a Portainer git stack
# clones only the infra repo, so it cannot build from this one.
name: Publish image

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # The runner is x86; arm64 needs emulation to build here.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/klartika/gsc-mcp-server
          # No `latest`. The deployment repo's convention is that a stack pins
          # a real version or a digest and never a moving tag, so publishing
          # `latest` here only creates something for someone to pin by mistake.
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-

      # linux/arm64 only: the Portainer host is ARM and nothing else consumes
      # this image. Add linux/amd64 here if that changes.
      #
      # Dockerfile.remote, not the repo's Dockerfile -- the latter is upstream's
      # stdio image and is deliberately left untouched.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.remote
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
