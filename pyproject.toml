[project]
name = "mcp-search-console"
version = "0.4.0"
description = "Google Search Console MCP server with local and ChatGPT-compatible remote transports"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Amin Foroutan", email = "aio@aminforoutan.com"}
]
keywords = ["mcp", "google search console", "seo", "chatgpt", "claude", "search analytics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "google-api-python-client>=2.163.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
    "mcp[cli]>=1.27.0,<2.0.0",
    "PyJWT[crypto]>=2.10.1,<3.0.0",
    "starlette>=0.46.0,<1.0.0",
    "uvicorn>=0.34.0,<1.0.0",
    "platformdirs>=4.0.0",
]

[project.urls]
"Homepage" = "https://github.com/ZipSites/mp-gsc-mcp"
"Bug Tracker" = "https://github.com/ZipSites/mp-gsc-mcp/issues"
"Upstream" = "https://github.com/AminForou/mcp-gsc"

[project.scripts]
mcp-gsc = "gsc_server:main"
mcp-search-console = "gsc_server:main"
mp-gsc-mcp-http = "chatgpt_server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["gsc_server", "chatgpt_server", "gsc_seo_tools"]
