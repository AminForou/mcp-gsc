[project]
name = "mcp-search-console"
version = "0.3.3"
description = "Google Search Console integration for Model Context Protocol (MCP)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Amin Foroutan", email = "aio@aminforoutan.com"}
]
keywords = ["mcp", "google search console", "seo", "claude", "search analytics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
dependencies = [
    "google-api-python-client>=2.163.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
    "mcp[cli]>=1.28.1,<2.0.0",
    "platformdirs>=4.0.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "httpx>=0.28.1",
]

[project.urls]
"Homepage" = "https://github.com/AminForou/mcp-gsc"
"Bug Tracker" = "https://github.com/AminForou/mcp-gsc/issues"

[project.scripts]
mcp-gsc = "gsc_server:main"
mcp-search-console = "gsc_server:main"
gsc-mcp-http = "gsc_remote.app:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["gsc_server"]
packages = ["gsc_remote"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
